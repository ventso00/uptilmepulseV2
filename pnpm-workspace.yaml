packages:
  - .
  - shared
patchedDependencies:
  wouter@3.7.1: patches/wouter@3.7.1.patch
overrides:
  # Every entry is scoped to the parent that pins the vulnerable release, so no
  # unrelated package is dragged onto a new major. Each target still satisfies
  # the parent's own range — these are advisories whose fix was published after
  # the lockfile was written.
  express>path-to-regexp: 0.1.13
  express>proxy-addr: ^2.0.8
  "@tailwindcss/oxide>tar": ^7.5.22
  "@tailwindcss/node>source-map-js": ^1.2.2
  vite>postcss: ^8.5.31
  postcss>nanoid: ^3.3.20
  vite>rollup: ^4.65.0
  vite>picomatch: ^4.0.7
  vitest>picomatch: ^4.0.7
  # recharts 2 declares lodash ^4.17.21 and 4.18.1 is the first release outside
  # the code-injection range, so this is a same-major patch, not a rewrite.
  recharts>lodash: ^4.18.1
  "@babel/helper-compilation-targets>browserslist": ^4.29.4
  browserslist>baseline-browser-mapping: ^2.11.30
  tailwindcss>nanoid: 3.3.20
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
